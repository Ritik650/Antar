name: CI

# CI is the authority, not a local run.
#
# Twice in one session a guard fired on newly-written code and caught a real defect;
# once a red suite was committed anyway, because the shell pipeline
# `pytest -q | tail -4 && git commit` takes its exit status from `tail`. Adding
# `python tasks.py gate` fixed that particular invocation, but a gate that can only be
# trusted when invoked one specific way is not a gate - someone under deadline pressure
# will invoke it the other way at 2am on 4 September.
#
# So: this workflow is the single source of truth for "is the build green", it runs the
# **same** `tasks.py` targets a developer runs, and `main` is protected by it. A local
# pass is a convenience; this is the verdict.

on:
  push:
    branches: [main]
  pull_request:
  # Catches the class of failure that only appears with time: an unpinned reference
  # instant, an expiring citation, a test that passes on a Tuesday. D13 was found by
  # accident when a midnight rolled over; it should have been found by a schedule.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  gate:
    name: gate (lint + full suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The identical target a developer runs. If these ever diverge, the local run is
      # the one that is wrong.
      - name: Gate
        run: python tasks.py gate

      - name: Typecheck
        run: python tasks.py typecheck
        continue-on-error: true  # advisory until mypy strict is clean on every package

      - name: Secret scan
        run: python -m scripts.secret_scan

      - name: Regulatory register is in sync with the code
        run: python -m scripts.make_register --check

  reproducibility:
    name: N4 - make evaluate from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # N4 is a claim about a clean checkout, so it is tested on one. A reviewer
      # running `make evaluate` and getting different numbers is the failure this job
      # exists to prevent.
      - name: Evaluate
        run: python tasks.py evaluate QUICK=1

      - name: Determinism - a second run must agree
        run: |
          cp artifacts/claims.json /tmp/claims-first.json
          python tasks.py evaluate QUICK=1
          diff /tmp/claims-first.json artifacts/claims.json

      # The artifact checks are skipped by the `gate` job, because a clean checkout has
      # no artifacts and that is a legitimate state. Here they are not optional: the
      # evaluation has just run twice, so anything that skips is a check that silently
      # found nothing to look at. See POSTMORTEM D28.
      - name: Artifact checks, with their absence made fatal
        env:
          ANTAR_REQUIRE_ARTIFACTS: "1"
        run: python -m pytest tests/statistical -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: artifacts/
          if-no-files-found: ignore

  coverage:
    name: coverage gate (85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: python tasks.py coverage

  image:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t antar:ci .
