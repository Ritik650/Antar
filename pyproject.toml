[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antar"
version = "0.1.0"
description = "A causal revenue-recovery controller for Indian recurring payments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "celery>=5.3",
    "redis>=5.0",
    "polars>=0.20",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "econml>=0.15",
    "pulp>=2.8",
    "anthropic>=0.25",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-ulid>=2.2",
    "streamlit>=1.32",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "hypothesis>=6.98",
    "respx>=0.21",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["antar*"]

[tool.setuptools.package-data]
antar = ["py.typed", "act/templates/*.yaml"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults
    "RUF012",  # mutable class attrs need ClassVar; noisy with pydantic
    "N818",    # exception naming
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802", "N806"]
"scripts/**" = ["ARG"]
# `X` for a design matrix and `y` for a target are the universal convention in the
# scikit-learn/econml world these modules live in. Renaming them to `x_train` would
# make the code *less* readable to anyone who works with estimators, so the naming
# rule is scoped out here rather than fought line by line.
"antar/decide/uplift/*" = ["N803", "N806"]
# Estimators share one `fit(X, treatment, outcome, *, propensity)` signature so they
# are interchangeable behind the protocol. Some learners genuinely do not use every
# argument - a propensity-targeting baseline ignores treatment by definition - and
# that is the point rather than an oversight.
"antar/decide/uplift/learners.py" = ["N803", "N806", "ARG002"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

# PLAN.md section 5: strict on the two packages that move money.
[[tool.mypy.overrides]]
module = ["antar.policy.*", "antar.decide.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "statistical: statistical validation gate (PLAN.md 9.1)",
    "chaos: fault-injection suite (PLAN.md 10)",
    "adversarial: prompt-injection and contamination suite (PLAN.md 9.4)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["antar"]
omit = ["antar/console/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
